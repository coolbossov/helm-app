name: Push Sync to Bigin

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  push-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Trigger push sync
        run: |
          response=$(curl -sS -o /dev/null -w "%{http_code}" \
            --max-time 30 \
            --retry 1 \
            --retry-delay 5 \
            -X GET "${{ secrets.APP_URL }}/api/sync/cron" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          echo "HTTP status: $response"
          if [ "$response" != "200" ]; then
            echo "Push sync failed with status $response"
            exit 1
          fi
